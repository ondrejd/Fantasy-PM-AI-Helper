[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-pl-ai-helper"
version = "0.1.0"
description = "AI-assisted Fantasy Premier League lineup recommender"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "requests>=2.31",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
]

[project.scripts]
fantasy-pl = "fantasy_pl_ai_helper.cli.main:main"
fantasy-pl-api = "fantasy_pl_ai_helper.api.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fantasy_pl_ai_helper.storage" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
